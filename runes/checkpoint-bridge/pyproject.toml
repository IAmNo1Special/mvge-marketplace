[project]
name = "mvgeos-runes-checkpoint-bridge"
version = "0.1.0"
description = "Shadow-git workspace checkpoints, atomic leaf restoration, and file rollbacks"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvgeos_runes_checkpoint_bridge/",
    "rune.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
