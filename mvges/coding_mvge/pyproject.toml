[project]
name = "coding_mvge"
version = "0.2.8"
description = "Concrete coding agent implementation for MvgeOS with built-in development spells"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "mvge",
]

[tool.uv.sources]
mvge = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.13"]
build-backend = "uv_build"

[tool.ruff]
extend = "../pyproject.toml"

[tool.pytest.ini_options]
# The mvge package IS this directory (it has __init__.py), so the import
# root is its parent -- `mvges/`, the mvge's own artifact root.
pythonpath = [".."]
testpaths = ["tests"]
# Test modules here are named after the module under test
# (`tests/unit/bash.py`), not `test_*.py`.
python_files = "*.py"
addopts = "--import-mode=importlib"
