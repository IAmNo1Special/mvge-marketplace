[project]
name = "mvgeos-runes-eval-bridge"
version = "0.1.0"
description = "Evaluation harness and RL data exporter compatible with google/adk-python evalsets"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvgeos_runes_eval_bridge/",
    "rune.py",
    "cli.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
