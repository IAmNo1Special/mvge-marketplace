[project]
name = "selfmod-bridge"
version = "0.1.0"
description = "Official self-modification & customization bridge for Mvge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvge_runes_selfmod_bridge/",
    "rune.py",
    "cli.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*.py"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
