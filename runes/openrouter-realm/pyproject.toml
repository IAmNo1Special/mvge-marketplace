[project]
name = "openrouter-realm"
version = "0.1.0"
description = "Official OpenRouter provider realm for Mvge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "openrouter.py",
    "rune.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
