[project]
name = "mcp-bridge"
version = "0.1.0"
description = "Official Model Context Protocol (MCP) bridge for Mvge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvge_runes_mcp_bridge/",
    "rune.py",
    "cli.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*.py"]
