[project]
name = "mvge-marketplace"
version = "0.1.0"
description = "Official Mvge catalog of Runes (extensions) and Mvges (agents)"
requires-python = ">=3.13"
dependencies = [
    "mvge>=0.1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.9",
    "goapauto>=0.4.0",
    "httpx>=0.27",
    "mcp>=2.2.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "psutil>=6.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tomli-w>=1.0.0",
]

[project.urls]
Repository = "https://github.com/IAmNo1Special/mvge-marketplace"
Documentation = "https://iamno1special.github.io/mvge-marketplace/"

[tool.uv.sources]
mvge = { path = "../mvge", editable = true }

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "runes/approval-rune/tests",
    "runes/openrouter-realm/tests",
    "runes/opencode-realm/tests",
    "runes/seeker/tests",
    "runes/mcp-bridge/tests",
    "runes/opentelemetry-bridge/tests",
    "runes/okf-bridge/tests",
    "runes/adr-bridge/tests",
    "runes/pi-codec/tests",
    "runes/skills-bridge/tests",
    "runes/steering-bridge/tests",
    "runes/selfmod-bridge/tests",
    "runes/skill-evolution/tests",
    "mvges/coding_mvge/tests",
    "runes/session-search/tests",
    "runes/submvge-bridge/tests",
    "runes/checkpoint-bridge/tests",
    "runes/lsp-bridge/tests",
    "runes/codeact-rune/tests",
    "runes/eval-bridge/tests",
]
python_files = "*.py"
pythonpath = [
    "mvges",
    "runes/openrouter-realm",
    "runes/opencode-realm",
    "runes/seeker",
    "runes/mcp-bridge",
    "runes/opentelemetry-bridge",
    "runes/okf-bridge",
    "runes/adr-bridge",
    "runes/pi-codec",
    "runes/skills-bridge",
    "runes/steering-bridge",
    "runes/approval-rune",
    "runes/selfmod-bridge",
    "runes/skill-evolution",
    "runes/session-search",
    "runes/submvge-bridge",
    "runes/checkpoint-bridge",
    "runes/lsp-bridge",
    "runes/codeact-rune",
    "runes/eval-bridge",
]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]

[dependency-groups]
dev = [
    "mvge>=0.1.2",

    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
