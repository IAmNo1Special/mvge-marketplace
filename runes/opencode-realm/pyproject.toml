[project]
name = "opencode-realm"
version = "0.1.0"
description = "Official OpenCode Zen provider realm for Mvge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvge_runes_opencode_realm/",
    "rune.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]