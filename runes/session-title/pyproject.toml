[project]
name = "mvge-runes-session-title"
version = "0.1.0"
description = "Auto-generates session titles from conversation content with instant fallback and optional LLM upgrade"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "rune.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
