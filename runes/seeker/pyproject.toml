[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mvge-runes-seeker"
version = "0.1.0"
description = "Seeker Protocol rune for Mvge - DCI-based discovery for spells, skills, and MCP servers"
dependencies = [
    "mvge",
    "aiohttp",
]

[tool.hatch.build.targets.wheel]
packages = ["mvge_runes_seeker"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
