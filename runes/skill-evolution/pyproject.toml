[project]
name = "skill-evolution"
version = "0.3.0"
description = "Persistent experience consolidation and autonomous skill evolution for Mvge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvge_runes_skill_evolution/",
    "manifest.json",
    "rune.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*.py"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
]

[tool.ruff]
line-length = 80

[tool.mypy]
python_version = "3.13"
strict = true