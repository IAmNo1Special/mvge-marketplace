[project]
name = "mvge-runes-pi-codec"
version = "0.1.0"
description = "Import Pi agent session logs (JSONL v3/v4) into Mvge Tomes so any Pi session can resume in Mvge"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvge_runes_pi_codec/",
    "rune.py",
    "cli.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
