[project]
name = "steering-bridge"
version = "0.1.0"
description = "Official repository steering (AGENTS.md, .agents protocol) bridge for Mvge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvge_runes_steering_bridge/",
    "rune.py",
    "cli.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*.py"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
