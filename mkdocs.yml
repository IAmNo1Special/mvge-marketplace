site_name: Mvge Marketplace
site_url: https://iamno1special.github.io/mvge-marketplace/
site_description: Official extension marketplace for Mvge — runes, realms, and bridges.
site_author: IAmNo1Special
repo_url: https://github.com/IAmNo1Special/mvge-marketplace
repo_name: IAmNo1Special/mvge-marketplace

theme:
  name: material
  palette:
    # Default Dark Mode (Slate)
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Optional Light Mode toggle
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/puzzle

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Runes:
      - ADR Bridge: runes/adr-bridge.md
      - Approval Rune: runes/approval-rune.md
      - Checkpoint Bridge: runes/checkpoint-bridge.md
      - CodeAct Rune: runes/codeact-rune.md
      - Eval Bridge: runes/eval-bridge.md
      - LSP Bridge: runes/lsp-bridge.md
      - MCP Bridge: runes/mcp-bridge.md
      - OKF Bridge: runes/okf-bridge.md
      - OpenCode Realm: runes/opencode-realm.md
      - OpenRouter Realm: runes/openrouter-realm.md
      - OpenTelemetry Bridge: runes/opentelemetry-bridge.md
      - Pi Codec: runes/pi-codec.md
      - Pollinations Realm: runes/pollinations-realm.md
      - Seeker: runes/seeker.md
      - Self-Mod Bridge: runes/selfmod-bridge.md
      - Session Search: runes/session-search.md
      - Session Title: runes/session-title.md
      - Skill Evolution: runes/skill-evolution.md
      - Skills Bridge: runes/skills-bridge.md
      - Steering Bridge: runes/steering-bridge.md
      - Sub-Mvge Bridge: runes/submvge-bridge.md
