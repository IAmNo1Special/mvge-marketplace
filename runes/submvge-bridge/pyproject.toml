[project]
name = "mvge-runes-submvge-bridge"
version = "0.1.0"
description = "Kernel sub-Mvge summoning, persistent sub-sessions, and reactive wakeup bridge"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvge_runes_submvge_bridge/",
    "rune.py",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
