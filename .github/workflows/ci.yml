name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # This suite already builds against the engine's main branch, so a push
  # there can break it without anything in this repository changing. The
  # engine's own contract check catches the import-level version of that
  # immediately; this catches everything else -- signature and behaviour
  # changes the AST check cannot see -- within a day rather than at the
  # next marketplace push.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  ci:
    uses: IAmNo1Special/actions/.github/workflows/python-ci.yml@v1
    with:
      # Two things have to exist before the suite can mean anything.
      #
      # ripgrep: Seeker shells out to the `rg` program and `tool_search` has
      # no non-`rg` fallback, so CI has to provide ripgrep or the spell
      # discovery path is never exercised at all. ubuntu-latest does not ship
      # it, and that is not cosmetic: a machine that happens to have ripgrep
      # passes either way, which is exactly why a missing install can go
      # unnoticed until a clean runner hits it. `rg --version` fails this step
      # loudly instead of leaving three tests to report 'rg not found on
      # PATH' much later, from a place that has nothing to do with the cause.
      #
      pre-commands: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends ripgrep
        rg --version
      install-command: "uv sync"
      run-lint: false
      # Each rune ships its own pyproject.toml declaring third-party deps
      # (mcp, opentelemetry, typer, pyyaml, aiohttp, ...) that are not part of
      # the engine workspace. Collect them all and layer them onto the test
      # environment via --with, so newly added runes don't break CI.
      # mvge deps come from the engine sync above and are skipped.
      #
      # --with notes:
      # - pytest-asyncio: heal-my-goap's test suite has async tests,
      #   and the `tests/` + `runes/` collection picks them up like the rest.
      #
      # No test path arguments: pytest reads `testpaths` from the root
      # pyproject.toml, so CI and a local `pytest` run the same set. The
      # consistency tests in tests/ assert that testpaths still covers every
      # artifact in index.json, so a new rune cannot be added without its
      # tests being collected.
      test-commands: |
        WITH_ARGS=""
        for py in runes/*/pyproject.toml; do
          [ -f "$py" ] || continue
          while IFS= read -r dep; do
            case "$dep" in
              ""|\#*) continue ;;
              mvge|mvge-*) continue ;; # provided by the engine workspace sync
              ./*|/*|*://*) echo "WARNING: skipping non-PyPI dep '$dep' from $py" >&2; continue ;;
              *) WITH_ARGS="$WITH_ARGS --with $dep" ;;
            esac
          done < <(python3 -c "import sys,tomllib; print('\n'.join(tomllib.load(open(sys.argv[1],'rb')).get('project',{}).get('dependencies',[])))" "$py")
        done
        uv run $WITH_ARGS --with pytest-asyncio python -m pytest -q
